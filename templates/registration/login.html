{% extends "admin/login.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        background-color: #f8f9fa !important;
        margin: 0;
        padding-top: 110px !important;
        display: flex;
        flex-direction: column;
        min-height: 85.8vh;
    }
    #header, .header { display: none !important; }

    /* ── Navbar: gradient kuning → biru DJKI ── */
    .navbar-custom {
        background: linear-gradient(135deg, #FFCD02 0%, #FFCD02 30%, #c9a200 42%, #313E5E 70%);
        z-index: 10000;
        min-height: 98px;
    }
    .navbar-custom, .navbar-custom * { box-sizing: border-box !important; }
    .navbar-custom .d-flex              { display: flex !important; }
    .navbar-custom .align-items-center  { align-items: center !important; }
    .navbar-custom .justify-content-between { justify-content: space-between !important; }
    .navbar-custom .flex-column         { flex-direction: column !important; }
    .navbar-custom .align-items-end     { align-items: flex-end !important; }
    .navbar-custom .gap-3               { gap: 1rem !important; }
    .navbar-custom .gap-2               { gap: 0.5rem !important; }
    .navbar-custom .mb-2                { margin-bottom: 0.5rem !important; }
    .navbar-custom .fw-bold             { font-weight: 700 !important; }
    .navbar-custom img {
        display: block !important; height: 55px !important; width: auto !important;
        max-width: none !important; max-height: none !important; flex-shrink: 0 !important;
        background-color: white !important; padding: 5px !important;
        border-radius: 8px !important; vertical-align: unset !important; border: none !important;
    }
    .brand-text {
        font-size: 1.25rem; font-weight: 600; color: white; line-height: 1.2;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        text-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }
    .copyable-text {
        user-select: text !important; -webkit-user-select: text !important;
        -moz-user-select: text !important; -ms-user-select: text !important; cursor: text;
    }

    /* ── Tombol navbar ── */
    .btn-nav-custom {
        height: 38px; padding: 6px 16px; font-size: 14px; font-weight: 600;
        border-radius: 6px; display: inline-flex; align-items: center; gap: 8px;
        text-decoration: none !important; transition: all 0.2s ease-in-out;
        border: 1.5px solid transparent; cursor: pointer; white-space: nowrap; line-height: 1;
    }
    .btn-nav-white {
        background: transparent; color: white !important; border-color: white !important;
    }
    /* Hover Login Admin / Kembali → kuning DJKI */
    .btn-nav-white:hover,
    .btn-nav-white:active {
        background-color: #FFCD02 !important;
        color: #313E5E !important;
        border-color: #FFCD02 !important;
    }
    .btn-nav-light  { background-color: #f8f9fa; color: #313E5E !important; border-color: #f8f9fa; }
    .btn-nav-light:hover  { background-color: #e2e6ea; }
    .btn-nav-danger { background-color: #dc3545; color: white !important; border: none; }

    /* ── Login card ── */
    #container {
        background: transparent !important; border: none !important;
        width: 100% !important; margin: auto !important;
        display: flex; justify-content: center; align-items: center;
    }
    .login #content {
        background: #fff !important; padding: 0 !important;
        border-radius: 12px !important; box-shadow: 0 15px 35px rgba(0,0,0,0.1) !important;
        width: 450px !important; min-width: 450px !important; max-width: 450px !important;
        overflow: hidden;
    }
    @media (max-width: 1024px) {
        .login #content { width: 450px !important; min-width: 450px !important; max-width: 450px !important; }
    }
    .login-top-banner {
        background: linear-gradient(135deg, #FFCD02 0%, #FFCD02 30%, #c9a200 42%, #313E5E 70%);
        color: white; text-align: center; padding: 20px;
        font-weight: 800; font-size: 1.1rem; letter-spacing: 1px;
        text-transform: uppercase; text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
    #content-main { padding: 35px !important; margin: 0 !important; }
    .form-row { border: none !important; padding: 0 0 20px 0 !important; }
    .form-row label {
        font-weight: 700 !important; color: #313E5E !important;
        margin-bottom: 8px !important; display: block !important;
        font-size: 0.95rem !important;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
    }
    input[type="text"], input[type="password"] {
        border-radius: 8px !important; padding: 12px 15px !important;
        border: 1px solid #ced4da !important; width: 100% !important;
        font-size: 1rem !important; box-sizing: border-box !important;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        transition: border-color 0.2s !important;
    }
    input[type="text"]:focus, input[type="password"]:focus {
        outline: none !important; border-color: #313E5E !important;
        box-shadow: 0 0 0 3px rgba(49, 62, 94, 0.1) !important;
    }
    .submit-row {
        display: flex !important; flex-direction: row !important;
        gap: 15px !important; padding: 0 !important; margin: 10px 0 0 0 !important;
        background: none !important; border: none !important;
    }
    .submit-row input[type="submit"], .btn-guest-shared {
        flex: 1 !important; height: 52px !important; border-radius: 10px !important;
        font-weight: 800 !important; font-size: 0.8rem !important;
        text-transform: uppercase; display: flex !important;
        align-items: center; justify-content: center;
        margin: 0 !important; transition: 0.2s; cursor: pointer;
    }
    /* Tombol Login → biru DJKI, hover kuning */
    .submit-row input[type="submit"] {
        background-color: #313E5E !important; color: white !important; border: none !important;
    }
    .submit-row input[type="submit"]:hover {
        background-color: #FFCD02 !important; color: #313E5E !important;
    }
    /* Tombol Continue as a Guest → putih outline, hover kuning */
    .btn-guest-shared {
        background-color: white !important; color: #313E5E !important;
        border: 2px solid #313E5E !important; text-decoration: none !important;
    }
    .btn-guest-shared:hover {
        background-color: #FFCD02 !important; color: #313E5E !important;
        border-color: #FFCD02 !important;
    }
    .register-foot-note {
        text-align: center; margin-top: 30px;
        font-size: 0.95rem; color: #6c757d;
    }
    .register-foot-note a { color: #313E5E; font-weight: 800; text-decoration: none !important; }
    .register-foot-note a:hover { text-decoration: underline !important; }
</style>
{% endblock %}

{% block content %}
<nav class="navbar navbar-dark navbar-custom shadow-sm fixed-top" style="padding: 16px 16px;">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <img src="{% static 'logo_dgip.png' %}" alt="Logo DGIP">
            <span class="brand-text copyable-text">Penelusuran Fonetik</span>
        </div>
        <div class="d-flex flex-column align-items-end">
            <div class="d-flex align-items-center gap-3 mb-2">
                <div id="liveClock" class="text-white"
                    style="font-size: 0.85rem; font-weight: 500; opacity: 0.9; white-space: nowrap;">Memuat...</div>
            </div>
        </div>
    </div>
</nav>

<div class="login-top-banner">Login Admin</div>

{{ block.super }}

<script>
    function updateClock() {
        const now = new Date();
        const DAYS = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
        const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const local = new Date(now.toLocaleString('en-US', { timeZone: tz }));
        const hh = String(local.getHours()).padStart(2,'0');
        const mm = String(local.getMinutes()).padStart(2,'0');
        const ss = String(local.getSeconds()).padStart(2,'0');
        const el = document.getElementById('liveClock');
        if (el) el.innerHTML =
            `${DAYS[local.getDay()]} ${MONTHS[local.getMonth()]} ${String(local.getDate()).padStart(2,'0')} ${local.getFullYear()} - ${hh}.${mm}.${ss} (${tz})`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function applyStyleFixes() {
        const submitRow = document.querySelector('.submit-row');
        if (submitRow && !document.getElementById('guest-btn-final')) {
            const guestBtn = document.createElement('a');
            guestBtn.id = 'guest-btn-final';
            guestBtn.href = "{% url 'search_view' %}";
            guestBtn.className = 'btn-guest-shared';
            guestBtn.innerText = 'CONTINUE AS A GUEST';
            submitRow.prepend(guestBtn);
        }
        const form = document.getElementById('login-form');
        if (form && !document.getElementById('reg-link-final')) {
            const footerDiv = document.createElement('div');
            footerDiv.id = 'reg-link-final';
            footerDiv.className = 'register-foot-note';
            footerDiv.innerHTML = 'Don\'t have an account? <a href="{% url "register" %}">Register Here</a>';
            const submitRow2 = document.querySelector('.submit-row');
            if (submitRow2) submitRow2.parentNode.insertBefore(footerDiv, submitRow2.nextSibling);
        }
    }
    document.addEventListener('DOMContentLoaded', applyStyleFixes);
    new MutationObserver(applyStyleFixes).observe(document.body, { childList: true, subtree: true });
</script>
{% endblock %}
